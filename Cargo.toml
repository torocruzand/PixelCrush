[package]
name = "image-converter"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "image-converter"
path = "src/main.rs"

[dependencies]
slint = "1.9"
image = { version = "0.25", default-features = false, features = [
    "png", "jpeg", "webp", "gif", "bmp", "tiff",
] }
mozjpeg = { version = "0.10", default-features = false, features = ["with_simd"] }
oxipng = { version = "9", default-features = false, features = ["filetime", "parallel", "zopfli"] }
webp = "0.3"
anyhow = "1.0"
rayon = "1.10"
rfd = "0.15"
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
once_cell = "1.20"
bytemuck = "1.16"

[build-dependencies]
slint-build = "1.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
